name: CI Build and Tag

on:
  workflow_call:
    outputs:
      image_tag:
        description: Docker image tag generated for this pipeline run
        value: ${{ jobs.build-and-tag.outputs.image_tag }}

permissions:
  contents: write

jobs:
  build-and-tag:
    name: Build model-train Image and Tag Release
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.release-tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image tag
        id: release-tag
        run: |
          IMAGE_TAG="v0.1.${{ github.run_number }}"
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "${GITHUB_ENV}"

      - name: Build model-train image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/model_train/Dockerfile
          push: false
          load: true
          tags: |
            personalization/model-train:${{ env.IMAGE_TAG }}
            personalization/model-train:latest
          cache-from: type=gha,scope=model-train
          cache-to: type=gha,mode=max,scope=model-train

      - name: Create and push git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${IMAGE_TAG} already exists. Skipping tag creation."
            exit 0
          fi

          git tag "${IMAGE_TAG}"
          git push origin "${IMAGE_TAG}"
