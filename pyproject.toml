[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.pylint.main]
py-version = "3.12"
jobs = 0
recursive = true
ignore-paths = ["notebooks"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "import-error",
    "no-member",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 100
